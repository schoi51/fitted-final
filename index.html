<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fitted Prototype</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&display=swap">
<style>
/* Layout: presenter rail on the left, scaled iPhone on the right. App surface is a fixed light design; the outer stage follows theme. */
:root{
  --stage:#E6E6EA; --rail-fg:#131316; --rail-mut:#6E6E78; --rail-line:rgba(19,19,22,.1); --rail-card:#F4F4F6;
  --ink:#131316; --mut:#8A8A94; --sub:#5E5E68; --can:#EEEEF0; --pos:#23A86B; --alert:#FF4E3A;
  --font:"Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--stage:#121216;--rail-fg:#EDEDF2;--rail-mut:#9A9AA6;--rail-line:rgba(255,255,255,.1);--rail-card:#1C1C22;color-scheme:dark}}
:root[data-theme="dark"]{--stage:#121216;--rail-fg:#EDEDF2;--rail-mut:#9A9AA6;--rail-line:rgba(255,255,255,.1);--rail-card:#1C1C22;color-scheme:dark}
html,body{height:100%}
body{background:var(--stage);color:var(--rail-fg);font-family:var(--font);-webkit-font-smoothing:antialiased;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));box-sizing:border-box}
*{box-sizing:border-box}
.stage{display:flex;flex-direction:column;gap:18px;align-items:center;justify-content:center;min-height:100%;padding-block:24px}
.phone-wrap{flex:none;position:relative}
/* iPhone 16 Pro style device: natural titanium band, black bezel, side buttons */
.phone{position:absolute;left:0;top:0;width:426px;height:880px;border-radius:72px;padding:5px;transform-origin:0 0;
  background:linear-gradient(135deg,#d9d4cb 0%,#8e8981 18%,#c9c4ba 34%,#f1ede6 48%,#9a958c 62%,#7b7770 78%,#cfc9bf 100%);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.55),inset 0 0 2px 2px rgba(0,0,0,.25),0 2px 4px rgba(0,0,0,.18),0 40px 90px -24px rgba(0,0,0,.45),0 18px 36px -18px rgba(0,0,0,.35)}
.bezel{width:100%;height:100%;border-radius:67px;background:#030304;padding:13px;box-shadow:inset 0 0 0 1.5px #2b2b2e,inset 0 0 0 3px #0b0b0c}
.btn-side{position:absolute;width:5px;border-radius:2px;background:linear-gradient(90deg,#6f6b64,#d8d3ca 45%,#8e8a82)}
.btn-side.l{left:-4px;border-radius:3px 0 0 3px}.btn-side.r{right:-4px;border-radius:0 3px 3px 0}
.restart{all:unset;cursor:pointer;font:500 13px var(--font);color:var(--rail-mut);padding:8px 14px;border-radius:999px;border:1px solid var(--rail-line)}
.restart:focus-visible{outline:2px solid var(--rail-fg);outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

/* ===== App surface (fixed light look) ===== */
.app{position:relative;width:390px;height:844px;border-radius:54px;overflow:hidden;background:var(--can);color:var(--ink);font-family:var(--font);user-select:none;-webkit-user-select:none}
.scr{position:absolute;inset:0;overflow:hidden}
.scr.enter{animation:enter .34s cubic-bezier(.2,.8,.2,1)}
@keyframes enter{from{opacity:0;transform:translateY(10px) scale(.99)}to{opacity:1;transform:none}}
.day{--g1:#8C9AFF;--g2:#C3B4FF;--g3:#A6D6FF;--gt:#fff}
.eve{--g1:#FF8AAE;--g2:#FF9C70;--g3:#FFCB8E;--gt:var(--ink)}
.morn{--g1:#7ADBB6;--g2:#CDEE88;--g3:#98E2E8;--gt:var(--ink)}
.glow{position:absolute;border-radius:50%;filter:blur(90px);pointer-events:none}
.ab{position:absolute;left:24px;right:24px}
.sb{position:absolute;top:0;left:0;right:0;height:54px;z-index:5;pointer-events:none}
.sb .t{position:absolute;left:38px;top:17px;font:600 16px var(--font)}
.sb .isl{position:absolute;left:135px;top:11px;width:120px;height:34px;border-radius:17px;background:#000}
.sb svg{position:absolute;left:292px;top:19px}
.light .sb .t{color:#fff}
.home{position:absolute;left:128px;bottom:9px;width:134px;height:5px;border-radius:3px;background:var(--ink);z-index:6;pointer-events:none}
.light .home{background:#fff}
.caps{font:500 11px/1.25 var(--font);letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
.h1{font:400 40px/42px var(--font);letter-spacing:-.03em;margin:0;text-wrap:balance}
.sub{font:400 15px/21px var(--font);color:var(--sub);letter-spacing:-.01em}
.top{position:absolute;top:58px;left:24px;right:24px;height:44px;display:flex;align-items:center;justify-content:space-between;z-index:4}
.top .ttl{font-size:15px;color:#55555E}
.circ{width:44px;height:44px;border-radius:50%;background:#fff;display:grid;place-items:center;flex:none;cursor:pointer;box-shadow:0 2px 6px rgba(20,20,36,.06),0 12px 28px -6px rgba(20,20,36,.09)}
.circ.ink{background:var(--ink)}
.circ.ghost{opacity:0;pointer-events:none}
.tap{cursor:pointer;box-shadow:0 2px 6px rgba(20,20,36,.06),0 12px 28px -6px rgba(20,20,36,.09);transition:transform .15s}
.tap:active,.circ:active,.cta:active,.pill.t:active{transform:scale(.97)}
[data-act]:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.white{background:rgba(255,255,255,.92);border:1px solid #fff;border-radius:28px}
.glass{position:relative;border-radius:32px;overflow:hidden;color:var(--gt);
  background:radial-gradient(60% 70% at 15% 0%,rgba(255,255,255,.5),rgba(255,255,255,0) 70%),linear-gradient(125deg,var(--g1),var(--g2) 55%,var(--g3));
  box-shadow:inset 0 1.5px 1px #fff,inset 5px 9px 12px rgba(255,255,255,.75),inset -5px -8px 14px rgba(255,255,255,.45),inset 0 0 30px -2px rgba(13,13,30,.1)}
.glass::before{content:"";position:absolute;inset:0;background:linear-gradient(160deg,rgba(255,255,255,.38),rgba(255,255,255,.06) 42%,transparent 43%);pointer-events:none}
.glass::after{content:"";position:absolute;inset:0;border-radius:inherit;padding:2px;background:linear-gradient(145deg,#fff,rgba(255,255,255,.25) 45%,rgba(255,255,255,.85));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
.glass.tap{box-shadow:inset 0 1.5px 1px #fff,inset 5px 9px 12px rgba(255,255,255,.75),inset -5px -8px 14px rgba(255,255,255,.45),inset 0 0 30px -2px rgba(13,13,30,.1),0 2px 6px rgba(20,20,36,.06),0 12px 28px -6px rgba(20,20,36,.12)}
.glass > *{position:relative;z-index:1}
.ab.glass{position:absolute}
.glass .caps{color:var(--gt);opacity:.8}
.orb{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;flex:none;position:relative;overflow:hidden;
  background:radial-gradient(60% 70% at 25% 10%,rgba(255,255,255,.6),rgba(255,255,255,0) 70%),linear-gradient(125deg,var(--g1),var(--g2) 55%,var(--g3));
  box-shadow:inset 0 1.5px 1px #fff,inset 3px 5px 7px rgba(255,255,255,.7),inset -3px -4px 8px rgba(255,255,255,.4)}
.cta{position:absolute;left:24px;right:24px;height:60px;border-radius:30px;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 8px 0 24px;font:500 16px var(--font);letter-spacing:-.01em;cursor:pointer;box-shadow:0 2px 6px rgba(20,20,36,.08),0 12px 28px -6px rgba(20,20,36,.2);transition:opacity .2s,transform .15s}
.cta.off{opacity:.35;pointer-events:none}
.link{position:absolute;left:24px;right:24px;text-align:center;font:500 14px var(--font);color:var(--sub);cursor:pointer}
.pill{display:inline-flex;align-items:center;gap:7px;border-radius:999px;padding:9px 14px;font:500 13px var(--font);letter-spacing:-.01em;white-space:nowrap}
.pill.white{background:#fff;border:none}
.pill.ink{background:var(--ink);color:#fff}
.pill.ghost{background:rgba(255,255,255,.45);border:1px solid rgba(255,255,255,.9)}
.pill.dark{background:rgba(30,30,48,.3);color:#fff;border:1px solid rgba(255,255,255,.28);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:inset 0 1px 1px rgba(255,255,255,.5),inset 2px 3px 5px rgba(255,255,255,.18)}
.pill.t{cursor:pointer;box-shadow:0 2px 6px rgba(20,20,36,.06),0 10px 22px -6px rgba(20,20,36,.1)}
.pill.sm{font-size:12px;padding:7px 12px}
.dot{width:8px;height:8px;border-radius:50%;flex:none}
.ring{width:10px;height:10px;border-radius:50%;border:1.6px solid currentColor;flex:none}
.wrap{display:flex;flex-wrap:wrap;gap:10px 8px}
.row{display:flex;align-items:center}
.num{font-weight:300;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.tabs{display:flex;gap:18px}
.tabs b{font:500 11px var(--font);letter-spacing:.08em;text-transform:uppercase;color:#A6A6AF;cursor:pointer}
.tabs b.on{color:var(--ink)}
.matrix{display:grid;grid-template-columns:repeat(26,7px);gap:4.2px}
.matrix i{width:7px;height:7px;border-radius:50%;background:#D9D9DF;opacity:.55}
.matrix i.on{background:#B4B4BE;opacity:1}
.tabbar{position:absolute;left:24px;right:24px;top:740px;height:64px;border-radius:32px;background:rgba(255,255,255,.8);border:1px solid #fff;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);display:grid;grid-template-columns:repeat(4,1fr);padding:6px;box-shadow:inset 0 1.5px 1px #fff,0 2px 6px rgba(20,20,36,.06),0 12px 28px -6px rgba(20,20,36,.09)}
.tabbar span{display:grid;place-items:center;border-radius:26px;font:500 14px var(--font);color:var(--mut);cursor:pointer}
.tabbar span.on{background:var(--ink);color:#fff;box-shadow:0 4px 12px -4px rgba(0,0,0,.4)}
.tabbar span.dim{opacity:.45;cursor:default}
.toast{position:absolute;left:50%;top:110px;transform:translateX(-50%);background:rgba(19,19,22,.86);color:#fff;font:500 13px var(--font);padding:10px 16px;border-radius:999px;z-index:40;animation:toast 2.2s forwards;pointer-events:none;white-space:nowrap;backdrop-filter:blur(10px)}
@keyframes toast{0%{opacity:0;transform:translate(-50%,-6px)}12%,80%{opacity:1;transform:translate(-50%,0)}100%{opacity:0}}
/* sheets */
.bd{position:absolute;inset:0;background:rgba(14,14,26,.32);z-index:30;animation:fade .2s}
.sheet{position:absolute;left:8px;right:8px;bottom:8px;border-radius:40px;background:rgba(255,255,255,.86);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);z-index:31;padding:28px 24px 24px;animation:up .32s cubic-bezier(.2,.8,.2,1);box-shadow:inset 0 1.5px 1px #fff,inset 5px 9px 12px rgba(255,255,255,.75),inset -5px -8px 14px rgba(255,255,255,.45),0 12px 40px -8px rgba(20,20,36,.25)}
.sheet::before{content:"";position:absolute;left:50%;top:10px;width:48px;height:5px;border-radius:3px;background:#C9C9D2;transform:translateX(-50%)}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}}
.sheet h2{font:400 26px/1.15 var(--font);letter-spacing:-.03em;margin:4px 0 6px}
.opt{display:flex;align-items:center;justify-content:space-between;height:64px;padding:0 20px;border-radius:22px;background:#fff;font-size:16px;cursor:pointer;box-shadow:0 2px 6px rgba(20,20,36,.06),0 10px 22px -8px rgba(20,20,36,.1)}
.btn{height:56px;border-radius:28px;display:grid;place-items:center;font:500 16px var(--font);cursor:pointer;box-shadow:0 2px 6px rgba(20,20,36,.06),0 12px 28px -6px rgba(20,20,36,.12)}
.btn.ink{background:var(--ink);color:#fff}.btn.w{background:#fff}
.cal{display:grid;grid-template-columns:repeat(7,1fr);row-gap:8px;margin-top:14px}
.cal .wd{font:500 11px var(--font);color:var(--mut);text-align:center;letter-spacing:.08em}
.cal button{all:unset;cursor:pointer;width:40px;height:40px;border-radius:50%;justify-self:center;display:grid;place-items:center;font-size:15px;font-variant-numeric:tabular-nums}
.cal button:hover{background:rgba(19,19,22,.06)}
.cal button.sel{background:var(--ink);color:#fff;font-weight:500;box-shadow:0 4px 12px -4px rgba(0,0,0,.4)}
.cal button.today{box-shadow:inset 0 0 0 1px #C9C9D2}
.tog{width:52px;height:32px;border-radius:16px;position:relative;background:#DCDCE2;transition:background .2s;flex:none}
.tog::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.15);transition:left .2s}
.tog.on{background:linear-gradient(125deg,var(--g1),var(--g2) 55%,var(--g3))}
.tog.on::after{left:23px}
/* camera */
.shutter{position:absolute;left:155px;top:752px;width:80px;height:80px;border-radius:50%;border:3px solid #fff;display:grid;place-items:center;cursor:pointer;z-index:4}
.shutter i{width:64px;height:64px;border-radius:50%;background:#fff}
.chk{display:flex;align-items:center;gap:12px;font-size:15px;height:36px}
.chk .b{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;transition:background .3s}
.scanline{position:absolute;left:44px;width:302px;height:4px;border-radius:2px;background:linear-gradient(90deg,rgba(255,156,112,0),#FF9C70,rgba(255,203,142,0));box-shadow:0 0 16px #FF9C70;animation:scan 1.6s ease-in-out infinite alternate}
@keyframes wave{from{transform:scaleY(.35)}to{transform:scaleY(1)}}
@keyframes flash{from{opacity:1}to{opacity:0}}
.tick{animation:tick 1s ease-out}
@keyframes tick{from{transform:scale(1.18);opacity:.4}to{transform:none;opacity:1}}
@keyframes scan{from{top:160px}to{top:556px}}
.prog{height:8px;border-radius:4px;background:rgba(255,255,255,.35);overflow:hidden}
.prog i{display:block;height:100%;width:0;border-radius:4px;background:#fff;animation:prog 2s ease-out forwards}
@keyframes prog{to{width:100%}}
.moves{position:absolute;left:24px;right:0;top:322px;height:300px;display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding-right:24px;scrollbar-width:none}
.moves::-webkit-scrollbar{display:none}
.mcard{flex:none;width:228px;height:280px;border-radius:28px;background:#fff;padding:6px;scroll-snap-align:start;box-shadow:0 2px 6px rgba(20,20,36,.06),0 12px 28px -10px rgba(20,20,36,.12)}
.mcard img{width:216px;height:180px;object-fit:cover;border-radius:23px;display:block;pointer-events:none}
.seg{position:absolute;left:24px;right:24px;top:232px;height:52px;border-radius:26px;background:rgba(255,255,255,.92);display:grid;grid-template-columns:repeat(3,1fr);padding:4px}
.seg span{display:grid;place-items:center;border-radius:22px;font:500 15px var(--font);color:var(--sub);cursor:pointer;transition:background .2s,color .2s}
.seg span.on{background:var(--ink);color:#fff;box-shadow:0 4px 12px -4px rgba(0,0,0,.4)}
.slider{position:relative;height:28px;touch-action:none;cursor:pointer}
.slider .tr{position:absolute;left:0;right:0;top:9px;height:10px;border-radius:5px;background:rgba(255,255,255,.45)}
.slider .fi{position:absolute;left:0;top:9px;height:10px;border-radius:5px;background:#fff}
.slider .th{position:absolute;top:0;width:28px;height:28px;margin-left:-14px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(20,20,36,.12),0 8px 18px -4px rgba(20,20,36,.2)}
.slider.light .tr{background:#E4E4EA}.slider.light .fi{background:linear-gradient(90deg,var(--g1),var(--g2),var(--g3))}
.slider.light .th{box-shadow:0 0 0 1px #E4E4EA,0 2px 6px rgba(20,20,36,.12),0 8px 18px -4px rgba(20,20,36,.2)}
.cmp{position:absolute;left:24px;top:232px;width:342px;height:370px;border-radius:32px;overflow:hidden;touch-action:none;cursor:ew-resize}
.cmp img{position:absolute;inset:0;width:342px;height:370px;object-fit:cover;pointer-events:none}
.cmp .then{position:absolute;left:0;top:0;bottom:0;overflow:hidden}
.cmp .then img{filter:saturate(.4) brightness(.9) sepia(.12)}
.cmp .div{position:absolute;top:0;bottom:0;width:2px;margin-left:-1px;background:#fff}
.cmp .hd{position:absolute;top:165px;width:40px;height:40px;margin-left:-20px;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:0 2px 6px rgba(20,20,36,.12),0 10px 22px -6px rgba(20,20,36,.25)}
.bubble{background:rgba(255,255,255,.92);border:1px solid #fff;border-radius:6px 22px 22px 22px;padding:14px 16px;font-size:16px;line-height:22px;letter-spacing:-.01em}
.bubble.me{background:var(--ink);color:#fff;border-color:var(--ink);border-radius:22px 6px 22px 22px;align-self:flex-end}
.chat{position:absolute;left:24px;right:24px;top:120px;bottom:100px;overflow-y:auto;display:flex;flex-direction:column;gap:12px;scrollbar-width:none}
.chat::-webkit-scrollbar{display:none}
.inp{position:absolute;left:24px;right:24px;top:744px;height:60px;border-radius:30px;background:#fff;display:flex;align-items:center;padding:0 8px 0 22px;box-shadow:0 2px 6px rgba(20,20,36,.06),0 12px 28px -6px rgba(20,20,36,.09)}
.inp input{all:unset;flex:1;font:400 15px var(--font);color:var(--ink)}
.inp input::placeholder{color:var(--mut)}
.bar{transition:height .8s cubic-bezier(.2,.8,.2,1),top .8s cubic-bezier(.2,.8,.2,1)}
.lock .clock{position:absolute;left:0;right:0;text-align:center}
.banner{position:absolute;inset:0;z-index:20;pointer-events:none}
.sp1,.sp2,.sp3{opacity:0;animation:sprise .8s cubic-bezier(.2,.8,.2,1) forwards}
.sp1{animation-delay:.15s}.sp2{animation-delay:.6s}.sp3{animation-delay:1.3s}
@keyframes sprise{from{opacity:0;transform:translateY(16px) scale(.98);filter:blur(4px)}to{opacity:1;transform:none;filter:none}}
.splash.out{transition:opacity .45s ease,transform .45s ease;opacity:0;transform:translateY(-24px)}
@media(prefers-reduced-motion:reduce){.sp1,.sp2,.sp3{animation:none;opacity:1}}
.obstep{opacity:0;animation:obdrop .55s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes obdrop{from{opacity:0;transform:translateY(-18px)}to{opacity:1;transform:none}}
.obline{position:absolute;left:37.5px;width:1px;background:var(--mut);opacity:.7;transform:scaleY(0);transform-origin:top;animation:obdraw .7s ease-in-out forwards}
@keyframes obdraw{to{transform:scaleY(1)}}
@media(prefers-reduced-motion:reduce){.obstep{animation:none;opacity:1}.obline{animation:none;transform:none}}
.banner > div{pointer-events:auto;animation:drop .6s cubic-bezier(.2,.8,.2,1) .25s both}
@keyframes drop{from{opacity:0;transform:translateY(-28px) scale(.97)}to{opacity:1;transform:none}}
</style>

</head><body>
<div class="stage">
  <div class="phone-wrap" id="pw"><div class="phone" id="phone">
    <span class="btn-side l" style="top:178px;height:34px"></span><span class="btn-side l" style="top:236px;height:64px"></span><span class="btn-side l" style="top:314px;height:64px"></span><span class="btn-side r" style="top:262px;height:104px"></span>
    <div class="bezel"><div class="app" id="app"></div></div></div></div>
  <button class="restart" id="restart" type="button">Restart prototype</button>
</div>

<script>
(function(){
const $=s=>document.querySelector(s);
const app=$('#app');
const IMG={cam:'img/cam.jpg',side:'img/side.jpg',menu:'img/menu2.jpg',lock:'img/lock.jpg',meal:'img/meal.jpg',wall:'img/wall.jpg',band:'img/band.jpg',door:'img/door.jpg',back:'img/back.jpg',arm:'img/arm.jpg'};
Object.values(IMG).forEach(src=>{const i=new Image();i.src=src;});
const INK='#131316';
const IC={
back:c=>`<svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M12 4.5L6.5 10L12 15.5" stroke="${c}" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
grid:c=>`<svg width="20" height="20" viewBox="0 0 20 20" fill="none"><rect x="3.5" y="3.5" width="5" height="5" rx="1.5" stroke="${c}" stroke-width="1.5"/><rect x="11.5" y="3.5" width="5" height="5" rx="1.5" stroke="${c}" stroke-width="1.5"/><rect x="3.5" y="11.5" width="5" height="5" rx="1.5" stroke="${c}" stroke-width="1.5"/><rect x="11.5" y="11.5" width="5" height="5" rx="1.5" stroke="${c}" stroke-width="1.5"/></svg>`,
ur:c=>`<svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M6 14L14 6M7.5 6H14V12.5" stroke="${c}" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
plus:c=>`<svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M10 4.5V15.5M4.5 10H15.5" stroke="${c}" stroke-width="1.7" stroke-linecap="round"/></svg>`,

 const canPrev=c.y*12+c.m>2026*12+9,canNext=c.y*12+c.m<2027*12+5;
 body=`<div class="caps">${lab}</div><div class="row" style="justify-content:space-between;margin-top:4px"><h2 style="margin:0">${MFULL[c.m]} ${c.y}</h2><span class="row" style="gap:6px"><span class="circ" style="${canPrev?'':'opacity:.35;pointer-events:none'}" ${act('calnav',-1)} aria-label="Previous month">${ico('back')}</span><span class="circ" style="${canNext?'':'opacity:.35;pointer-events:none'}" ${act('calnav',1)} aria-label="Next month">${ico('right')}</span></span></div>
 <div class="cal">${['S','M','T','W','T','F','S'].map(d=>`<span class="wd">${d}</span>`).join('')}${'<span></span>'.repeat(first.getDay())}${Array.from({length:days},(_,i)=>{const d=i+1,isSel=sel&&sel.getFullYear()===c.y&&sel.getMonth()===c.m&&sel.getDate()===d;const isToday=c.y===2026&&c.m===10&&d===5;return `<button type="button" class="${isSel?'sel':''}${isToday?' today':''}" data-act="pickday" data-arg="${d}" aria-label="${WD[new Date(c.y,c.m,d).getDay()]}, ${MONTHS[c.m]} ${d}">${d}</button>`;}).join('')}</div>
 <div style="font-size:12px;color:var(--mut);margin-top:16px">Tap a date to save it.</div>`;}
if(s==='why'){body=`<div class="caps">Coach</div><h2>Why not 15 kg?</h2><p style="font-size:16px;line-height:24px;color:var(--sub);margin:8px 0 24px">Losing more than about 1 kg a week usually means crash dieting. It’s hard on your body and tends to come back after the wedding. 6 kg by ${MONTHS[S.dates.fit.getMonth()]} ${S.dates.fit.getDate()} keeps you healthy and still shows in the dress.</p><div class="btn ink" ${act('close')}>Got it</div>`;}
if(s==='safety'){body=`<div class="caps">Safety check</div><h2>Let’s keep it to 10 kg</h2><p style="font-size:16px;line-height:24px;color:var(--sub);margin:8px 0 22px">Apr 6 to Dec 1 is 34 weeks. Past 10 kg, the pace gets hard to keep, and you may feel drained right before the fitting.</p><div class="btn ink" ${act('capkg')}>Set to 10 kg</div><div class="btn w" style="margin-top:12px" ${act('sheet','why')}>Ask my coach why</div>`;}
if(s==='mile'){body=`<h2>Add a milestone</h2><div style="font-size:15px;color:var(--sub);margin-bottom:18px">We’ll plan around it.</div><div style="display:flex;flex-direction:column;gap:8px">${['Engagement photos','Bridal shower','Rehearsal dinner','Something else'].map(n=>`<div class="opt" ${act('addmile',n)}>${n}<span style="font-size:22px;font-weight:300">+</span></div>`).join('')}</div>`;}
if(s==='areas'){body=`<h2>Edit focus areas</h2><div style="font-size:15px;color:var(--sub);margin-bottom:18px">Turn off any area you don’t want to work on.</div><div class="day" style="display:flex;flex-direction:column;gap:8px">${Object.keys(S.areas).map(k=>`<div class="opt" ${act('area',k)} aria-pressed="${S.areas[k]}">${k}<span class="tog${S.areas[k]?' on':''}"></span></div>`).join('')}</div><div class="btn ink" style="margin-top:20px" ${act('close')}>Done</div>`;}
if(s==='rest'){body=`<h2>Where are you eating?</h2><div style="font-size:15px;color:var(--sub);margin-bottom:18px">We’ll suggest picks without a menu.</div><div style="display:flex;flex-direction:column;gap:8px">${['Korean BBQ','Chicken & beer','Banquet hall','Something else'].map(n=>`<div class="opt" ${act('restpick',n)}>${n}${ico('right')}</div>`).join('')}</div>`;}
if(s==='type'){const C=[['Samgyeopsal',330],['Pork neck',320],['Lettuce wraps',60],['Doenjang stew',150],['Naengmyeon',450],['Fried rice',380]];const on=C.filter(c=>S.typed[c[0]]);const kc=on.reduce((a,c)=>a+c[1],0);
 body=`<h2>Type the dishes</h2><div style="font-size:15px;color:var(--sub);line-height:21px">Add what’s on the table. We’ll estimate the calories and pick the best ones.</div>
 <form id="typef" style="margin-top:16px"><input id="typein" aria-label="Dish name" placeholder="e.g. samgyeopsal, doenjang stew" style="all:unset;box-sizing:border-box;width:100%;height:52px;border-radius:26px;background:#fff;box-shadow:inset 0 0 0 1px #E2E2E8;padding:0 20px;font:400 15px var(--font)"></form>
 <div class="caps" style="margin:18px 0 10px">Common at Korean BBQ</div><div class="wrap" style="gap:8px">${C.map(c=>{const o=!!S.typed[c[0]];return `<span class="pill t ${o?'ink':'white'}" ${act('typed',c[0])} style="font-size:14px;padding:10px 14px">${o?'✓':'+'} ${c[0]} <span style="font-weight:400;opacity:.65;font-size:12px">~${c[1]}</span></span>`;}).join('')}${Object.keys(S.typed).filter(k=>!C.some(c=>c[0]===k)).map(k=>`<span class="pill t ink" ${act('typed',k)} style="font-size:14px;padding:10px 14px">✓ ${k}</span>`).join('')}</div>
 <div style="height:52px;border-radius:26px;background:#F4F4F7;display:flex;align-items:center;padding:0 20px;font-weight:500;margin-top:18px">Added ${Object.keys(S.typed).length} · about ${kc.toLocaleString('en-US')} kcal</div>
 <div class="btn ink" style="margin-top:16px" ${act('restpick','typed')}>See my picks</div>`;}
if(s==='paused'){body=`<h2>Paused</h2><div style="font-size:15px;color:var(--sub);margin-bottom:22px">Your reps so far are saved. Take your time.</div><div class="btn ink" ${act('resume')}>Resume</div><div class="btn w" style="margin-top:12px" ${act('endsession')}>End session</div>`;}
return `<div class="bd" ${act(s==='paused'?'resume':'close')} aria-label="Close"></div><div class="sheet" role="dialog" aria-modal="true">${body}</div>`;}

/* ---------- render & navigation ---------- */
function render(anim){const html=SCR[cur]();app.innerHTML=html+sheetHTML();if(anim)app.firstElementChild.classList.add('enter');wire();}
function show(id,anim=true){clearT();cur=id;S.sheet=null;enter(id);render(anim);}
function go(id){if(cur)stack.push(cur);show(id);}
function replace(id){show(id);}
function back(){if(stack.length){const p=stack.pop();show(p);}}
function toast(t){const d=document.createElement('div');d.className='toast';d.textContent=t;app.appendChild(d);setTimeout(()=>d.remove(),2300);}
function restart(){S=fresh();stack=[];show('splash');}
function backShot(){S.count=null;S.flash=true;render();later(()=>{S.flash=false;toast('Photo saved · Nov 6');replace('compare');},450);}
function enter(id){
 if(id==='backcam'){S.count=null;S.heard=false;S.flash=false;}
 if(id==='cam'){S.camOk=false;later(()=>{S.camOk=true;render();if(S.camStep==='side')later(()=>replace('analyzing'),1300);},1500);}
 if(id==='splash')later(()=>{if(cur==='splash')ACT.tosetup();},3200);
 if(id==='analyzing')later(()=>replace('focus'),2200);
 if(id==='reading')later(()=>replace('order'),2200);
 if(id==='live'){S.rep=repTarget()-2;tickLive();}
 if(id==='next3')requestAnimationFrame(()=>requestAnimationFrame(()=>{app.querySelectorAll('.bar').forEach(b=>{b.style.top=b.dataset.top+'px';b.style.height=b.dataset.h+'px';});app.querySelectorAll('.bar-l').forEach(l=>l.style.opacity=1);}));
}
function tickLive(){clearT();every(()=>{if(S.sheet)return;const T=repTarget();if(S.rep<T){S.rep++;render();if(S.rep>=T){clearT();later(()=>{if(cur==='live'&&!S.sheet)go('nice');},1800);}}},1500);}

const ACT={
 back:()=>back(),go:a=>go(a),toast:t=>toast(t),
 dinnerdone:()=>{S.dinner=false;S.dinnerDone=true;stack=[];show('home');toast('Back on track. Plan saved.');},
 home:t=>{stack=[];show('home');if(t)toast(t);},
 finishsetup:()=>{S.stage='apr6';S.dinner=true;stack=[];show('home');},
 tosetup:()=>{if(cur!=='splash')return;const e=app.querySelector('.splash');if(e)e.classList.add('out');later(()=>show('welcome'),450);},
skipsetup:()=>{S.stage='new';stack=[];show('home');},
 ptype:t=>{S.ptype=t;render();},
 saveplan:()=>{stack=[];show('home');toast('Saved. We’ll remind you the day before.');},
 saveorder:()=>{S.dinnerSeen=true;S.log=S.picks.map(i=>({n:DISHES[i][0],k:DISH_KCAL[i],q:1}));if(S.picks.length)toast('Dinner plan saved');go('log');},
 logplanned:()=>{S.logged=logTotal();toast('Logged as planned');go('next3');},
 tonov6:()=>{S.stage='nov6';S.dinner=false;S.morningDone=false;S.morningLater=false;stack=[];show('home');},
 morninglater:()=>{S.morningLater=true;render();toast('We’ll nudge you again at 7:40');},
 capkg:()=>{S.kg=10;S.kgSet=true;S.sheet=null;go('plan');},
 cal:k=>{const d=S.dates[k]||S.dates.fit;S.cal={key:k,y:d.getFullYear(),m:d.getMonth()};S.sheet='cal';render();},
 calnav:v=>{let m=S.cal.m+Number(v),y=S.cal.y;if(m<0){m=11;y--;}if(m>11){m=0;y++;}S.cal={...S.cal,m,y};render();},
 pickday:d=>{S.dates[S.cal.key]=new Date(S.cal.y,S.cal.m,Number(d));S.sheet=null;render();},
 sheet:s=>{S.sheet=s;render();},close:()=>{S.sheet=null;render();},
 addmile:n=>{if(!S.milestones.includes(n))S.milestones.push(n);S.sheet=null;render();toast(n+' added');},
 neck:n=>{S.neck=n;render();},
 camstart:()=>{S.camStep='front';go('cam');},
 shutter:()=>{if(S.camStep==='front'){S.camStep='side';clearT();S.camOk=false;render();later(()=>{S.camOk=true;render();later(()=>replace('analyzing'),1300);},1500);}else replace('analyzing');},
 area:k=>{S.areas[k]=!S.areas[k];render();},
 setkg:()=>{if(S.kg>10){S.sheet='safety';render();return;}S.kgSet=true;go('plan');},
 menushot:()=>replace('reading'),
 cammode:m=>{clearT();S.camMode=m;S.count=null;S.heard=false;render();},
 starttimer:()=>{S.count=10;render();every(()=>{S.count--;if(S.count<=0){clearT();backShot();}else render();},1000);},
 canceltimer:()=>{clearT();S.count=null;render();},
 voicecap:()=>{if(S.heard)return;S.heard=true;render();later(backShot,900);},
 upmenu:()=>{S.menuImg=null;S.sheet=null;replace('reading');},
 restpick:()=>{S.sheet=null;go('order');},
 typed:k=>{if(S.typed[k])delete S.typed[k];else S.typed[k]=true;render();},
 pick:i=>{i=Number(i);S.picks=S.picks.includes(i)?S.picks.filter(x=>x!==i):[...S.picks,i].sort();render();},
 portion:a=>{const [i,d]=a.split(':').map(Number);const it=S.log[i];if(!it)return;let v=it.q;if(d>0)v=v<1?v+.5:v+1;else v=v>1?v-1:Math.max(0,v-.5);if(v<=0)S.log.splice(i,1);else it.q=v;render();},
 tolog:()=>{S.log=S.picks.map(i=>({n:DISHES[i][0],k:DISH_KCAL[i],q:1}));go('log');},
 logdish:n=>{const k=S.log.findIndex(x=>x.n===n);if(k>=0)S.log.splice(k,1);else{const all=[...DISHES.map((d,i)=>[d[0],DISH_KCAL[i]]),...EXTRA];const c=all.find(x=>x[0]===n);if(c)S.log.push({n:c[0],k:c[1],q:1});}render();},
 logmeal:()=>{if(!S.log.length)return;S.logged=logTotal();toast('Dinner logged');go('next3');},
 range:r=>{S.range=r;render();},tab:t=>{go(t);},
 swap:()=>{toast('30-min walk added to Thursday');},
 len:v=>{S.len=Number(v);render();},
 resume:()=>{S.sheet=null;render();},endsession:()=>{S.sheet=null;go('nice');},
 coach:k=>{S.coach=k;render();const c=$('#chat');if(c)c.scrollTop=c.scrollHeight;},
 coachdone:t=>{S.morningDone=true;stack=[];show('home');toast(t);}
};
app.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el||!app.contains(el))return;e.preventDefault();const f=ACT[el.dataset.act];if(f)f(el.dataset.arg);});
app.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('[data-act]')){e.preventDefault();e.target.click();}if(e.key==='Escape'&&S.sheet){S.sheet=null;render();}});

function drag(el,onMove,onEnd){if(!el)return;const at=ev=>{const r=el.getBoundingClientRect();return Math.min(1,Math.max(0,(ev.clientX-r.left)/r.width));};
 el.addEventListener('pointerdown',ev=>{el.setPointerCapture(ev.pointerId);onMove(at(ev));const mv=e2=>onMove(at(e2));const up=()=>{el.removeEventListener('pointermove',mv);el.removeEventListener('pointerup',up);el.removeEventListener('pointercancel',up);onEnd&&onEnd();};el.addEventListener('pointermove',mv);el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up);});}
function wire(){
 const uf=$('#upf');if(uf)uf.addEventListener('change',()=>{const f=uf.files&&uf.files[0];if(!f)return;if(S.menuImg)URL.revokeObjectURL(S.menuImg);S.menuImg=URL.createObjectURL(f);S.sheet=null;replace('reading');});
 const sl=$('#sls');drag(sl,f=>{S.sleep=Math.round(4+f*6);const p=(S.sleep-4)/6*100;sl.querySelector('.fi').style.width=p+'%';sl.querySelector('.th').style.left=p+'%';$('#slnum').textContent=S.sleep;sl.setAttribute('aria-valuenow',S.sleep);});
 if(sl)sl.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key==='ArrowLeft'){S.sleep=Math.min(10,Math.max(4,S.sleep+(e.key==='ArrowRight'?1:-1)));render();$('#sls').focus();}});
 const ks=$('#kgs');drag(ks,f=>{const v=Math.round(f*20);S.kg=v;S.kgSet=false;const p=v/20*100;ks.querySelector('.fi').style.width=p+'%';ks.querySelector('.th').style.left=p+'%';$('#kgnum').textContent='\u2212'+v;},()=>{render();});
 if(ks)ks.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key==='ArrowLeft'){S.kg=Math.min(20,Math.max(0,S.kg+(e.key==='ArrowRight'?1:-1)));S.kgSet=false;render();$('#kgs').focus();}});
 const cm=$('#cmp');drag(cm,f=>{S.split=f*342;const x=S.split;cm.querySelector('.then').style.width=x+'px';cm.querySelector('.div').style.left=x+'px';cm.querySelector('.hd').style.left=x+'px';cm.setAttribute('aria-valuenow',Math.round(x));});
 if(cm)cm.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key==='ArrowLeft'){S.split=Math.min(342,Math.max(0,S.split+(e.key==='ArrowRight'?20:-20)));render();$('#cmp').focus();}});
 const cf=$('#chatf');if(cf)cf.addEventListener('submit',e=>{e.preventDefault();const v=$('#chatin').value.trim();if(!v)return;S.chat.push({me:true,t:v.replace(/[<>&]/g,'')});render();const c=$('#chat');c.scrollTop=c.scrollHeight;later(()=>{S.chat.push({me:false,t:'Got it. I’ll factor that into tomorrow’s plan.'});if(cur==='coach'){render();const c2=$('#chat');c2.scrollTop=c2.scrollHeight;}},900);});
 const tf=$('#typef');if(tf)tf.addEventListener('submit',e=>{e.preventDefault();const v=$('#typein').value.trim().replace(/[<>&]/g,'');if(v){v.split(',').map(s=>s.trim()).filter(Boolean).forEach(s=>{S.typed[s.charAt(0).toUpperCase()+s.slice(1)]=true;});render();$('#typein')&&$('#typein').focus();}});
 const mv=$('#moves');if(mv){mv.addEventListener('wheel',e=>{if(Math.abs(e.deltaY)>Math.abs(e.deltaX)){mv.scrollLeft+=e.deltaY;e.preventDefault();}},{passive:false});let sx=null,sl0=0;mv.addEventListener('pointerdown',e=>{if(e.pointerType!=='mouse')return;mv.setPointerCapture(e.pointerId);sx=e.clientX;sl0=mv.scrollLeft;mv.style.scrollSnapType='none';mv.style.cursor='grabbing';});mv.addEventListener('pointermove',e=>{if(sx!==null)mv.scrollLeft=sl0-(e.clientX-sx);});const end=()=>{if(sx!==null){sx=null;mv.style.scrollSnapType='';mv.style.cursor='';}};mv.addEventListener('pointerup',end);mv.addEventListener('pointercancel',end);}
}

$('#restart').addEventListener('click',restart);

/* ---------- scale phone to fit ---------- */
function fit(){const pw=$('#pw'),ph=$('#phone');const availH=innerHeight-48-56;const availW=innerWidth-32;const s=Math.min(1,availH/880,availW/426);ph.style.transform=`scale(${s})`;pw.style.width=426*s+'px';pw.style.height=880*s+'px';}
addEventListener('resize',fit);fit();
restart();
})();
</script>
